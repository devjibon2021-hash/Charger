name: Build Android APK

on:
  push:
    branches: [ main, master, 'jules-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build frontend
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Detect Gradle Directory
        run: |
          echo "Searching for Gradle wrapper (gradlew)..."
          if [ -f "./android/gradlew" ]; then
            echo "Found Gradle wrapper in ./android"
            chmod +x ./android/gradlew
            echo "GRADLE_DIR=android" >> $GITHUB_ENV
          elif [ -f "./gradlew" ]; then
            echo "Found Gradle wrapper in root"
            chmod +x ./gradlew
            echo "GRADLE_DIR=." >> $GITHUB_ENV
          else
            echo "Error: Android project or Gradle wrapper (gradlew) not found"
            return 1 2>/dev/null || false
          fi

      - name: Clean Gradle Build
        run: |
          cd $GRADLE_DIR
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: |
          cd $GRADLE_DIR
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
