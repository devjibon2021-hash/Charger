name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android Project and Gradle Wrapper
        run: |
          echo "Searching for Gradle wrapper (gradlew)..."
          if [ -f "./android/gradlew" ]; then
            echo "Found Gradle wrapper in ./android"
            chmod +x ./android/gradlew
            echo "GRADLE_DIR=android" >> $GITHUB_ENV
          elif [ -f "./gradlew" ]; then
            echo "Found Gradle wrapper in root"
            chmod +x ./gradlew
            echo "GRADLE_DIR=." >> $GITHUB_ENV
          else
            echo "Error: Android project or Gradle wrapper (gradlew) not found"
            exit 1
          fi

      - name: Clean Project Caches
        run: |
          cd $GRADLE_DIR
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: |
          cd $GRADLE_DIR
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Verify Generated APK
        run: |
          echo "Searching for generated APK..."
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Generated APK not found"
            exit 1
          fi
          echo "Generated APK: $APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          ls -lh "$APK_FILE"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargingAssistant-Debug-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30
